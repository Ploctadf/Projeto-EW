openapi: 3.0.3
info:
  title: EW2026 Interface Service
  version: 1.0.0
  description: Interface web server-side (Pug) da plataforma de recursos educativos.
servers:
  - url: http://localhost:16020
    description: Interface via gateway
  - url: http://localhost:16026
    description: Interface direta
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ew.sid
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
    ErrorPage:
      type: object
      properties:
        title:
          type: string
          example: Erro interno
        message:
          type: string
          example: Ocorreu um erro inesperado. Tente novamente.
paths:
  /openapi.json:
    get:
      tags: [Docs]
      summary: Obter especificacao OpenAPI em JSON
      responses:
        '200':
          description: Especificacao OpenAPI da Interface

  /docs:
    get:
      tags: [Docs]
      summary: Interface Swagger UI da interface web
      responses:
        '200':
          description: HTML do Swagger UI da Interface
          content:
            text/html:
              schema:
                type: string

  /health:
    get:
      tags: [Health]
      summary: Health check da interface
      responses:
        '200':
          description: Serviço disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /:
    get:
      tags: [Home]
      summary: Página inicial da interface
      responses:
        '200':
          description: HTML renderizado da página inicial
          content:
            text/html:
              schema:
                type: string

  /auth/login:
    get:
      tags: [Auth]
      summary: Formulário de login
      responses:
        '200':
          description: HTML do formulário de login
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [Auth]
      summary: Submeter login
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@teste.com
                password:
                  type: string
                  example: Admin123
      responses:
        '302':
          description: Redireciona para home em sucesso ou para login em erro

  /auth/register:
    get:
      tags: [Auth]
      summary: Formulário de registo
      responses:
        '200':
          description: HTML do formulário de registo
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [Auth]
      summary: Submeter registo
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [nome, email, password]
              properties:
                nome:
                  type: string
                  example: Utilizador Demo
                email:
                  type: string
                  format: email
                  example: demo@teste.com
                password:
                  type: string
                  example: Demo123
                filiacao:
                  type: string
                  example: Universidade do Minho
      responses:
        '302':
          description: Redireciona para login em sucesso ou para registo em erro

  /auth/logout:
    get:
      tags: [Auth]
      summary: Terminar sessão (GET)
      security:
        - sessionCookie: []
      responses:
        '302':
          description: Redireciona para login
    post:
      tags: [Auth]
      summary: Terminar sessão (POST)
      security:
        - sessionCookie: []
      responses:
        '302':
          description: Redireciona para login

  /auth/google:
    get:
      tags: [Auth]
      summary: Iniciar login OAuth com Google
      description: Disponivel apenas quando GOOGLE_CLIENT_ID e GOOGLE_CLIENT_SECRET estao configurados.
      responses:
        '302':
          description: Redireciona para o provider Google

  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Callback OAuth do Google
      description: Disponivel apenas quando GOOGLE_CLIENT_ID e GOOGLE_CLIENT_SECRET estao configurados.
      responses:
        '302':
          description: Redireciona apos login/registo OAuth

  /auth/facebook:
    get:
      tags: [Auth]
      summary: Iniciar login OAuth com Facebook
      description: Disponivel apenas quando FACEBOOK_APP_ID e FACEBOOK_APP_SECRET estao configurados.
      responses:
        '302':
          description: Redireciona para o provider Facebook

  /auth/facebook/callback:
    get:
      tags: [Auth]
      summary: Callback OAuth do Facebook
      description: Disponivel apenas quando FACEBOOK_APP_ID e FACEBOOK_APP_SECRET estao configurados.
      responses:
        '302':
          description: Redireciona apos login/registo OAuth

  /resources:
    get:
      tags: [Resources]
      summary: Listar recursos com filtros e paginação
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: tipo
          in: query
          schema:
            type: string
        - name: ano
          in: query
          schema:
            type: string
        - name: tema
          in: query
          schema:
            type: string
        - name: hashtag
          in: query
          schema:
            type: string
      responses:
        '200':
          description: HTML de listagem de recursos
          content:
            text/html:
              schema:
                type: string

  /resources/new:
    get:
      tags: [Resources]
      summary: Formulário de submissão de recurso
      security:
        - sessionCookie: []
      responses:
        '200':
          description: HTML do formulário
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirecionamento caso não autenticado/sem permissões
    post:
      tags: [Resources]
      summary: Submeter SIP (ZIP) para ingestão
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [sip]
              properties:
                sip:
                  type: string
                  format: binary
      responses:
        '302':
          description: Redireciona para detalhe do recurso ou para o formulário em erro

  /resources/new/simple:
    post:
      tags: [Resources]
      summary: Submeter recurso por formulario simples
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [titulo, tipo, visibilidade, ficheiros]
              properties:
                titulo:
                  type: string
                subtitulo:
                  type: string
                tipo:
                  type: string
                ano:
                  type: integer
                tema:
                  type: string
                hashtags:
                  type: string
                dataCriacao:
                  type: string
                descricao:
                  type: string
                visibilidade:
                  type: string
                  enum: [publico, privado]
                ficheiros:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '302':
          description: Redireciona para detalhe do recurso ou para o formulario em erro

  /resources/{id}:
    get:
      tags: [Resources]
      summary: Ver detalhe de recurso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: HTML com detalhe do recurso
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Página de erro quando recurso não existe
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/ErrorPage'

  /resources/{id}/edit:
    get:
      tags: [Resources]
      summary: Formulário de edição de recurso
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: HTML do formulário de edição
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirecionamento caso não tenha sessão/permissões

    post:
      tags: [Resources]
      summary: Guardar alterações do recurso
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [tipo, titulo, visibilidade]
              properties:
                tipo:
                  type: string
                titulo:
                  type: string
                subtitulo:
                  type: string
                ano:
                  type: integer
                tema:
                  type: string
                hashtags:
                  type: string
                dataCriacao:
                  type: string
                visibilidade:
                  type: string
                  enum: [publico, privado]
      responses:
        '302':
          description: Redireciona para o detalhe do recurso

  /resources/{id}/delete:
    post:
      tags: [Resources]
      summary: Remover recurso
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redireciona para a listagem de recursos

  /resources/{id}/dip:
    get:
      tags: [Resources]
      summary: Download do DIP do recurso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ficheiro ZIP do DIP
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          description: Sem autenticação para recurso privado
        '403':
          description: Sem permissões
        '404':
          description: Recurso não encontrado

  /resources/{id}/ratings:
    post:
      tags: [Resources]
      summary: Submeter avaliação de recurso
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [stars]
              properties:
                stars:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 5
      responses:
        '302':
          description: Redireciona para detalhe do recurso

  /posts:
    get:
      tags: [Posts]
      summary: Listar posts
      responses:
        '200':
          description: HTML com lista de posts
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [Posts]
      summary: Criar novo post
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [titulo, conteudo, resourceId]
              properties:
                titulo:
                  type: string
                conteudo:
                  type: string
                resourceId:
                  type: string
      responses:
        '302':
          description: Redireciona para detalhe do post ou para formulário em erro

  /posts/new:
    get:
      tags: [Posts]
      summary: Formulário para criar post
      security:
        - sessionCookie: []
      responses:
        '200':
          description: HTML do formulário
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirecionamento caso não tenha sessão iniciada

  /posts/{id}:
    get:
      tags: [Posts]
      summary: Ver detalhe de post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: HTML com detalhe do post
          content:
            text/html:
              schema:
                type: string

  /posts/{id}/edit:
    get:
      tags: [Posts]
      summary: Formulário de edição de post
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: HTML do formulário de edição
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirecionamento em falta de permissões
    post:
      tags: [Posts]
      summary: Guardar alterações de post
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [titulo, conteudo, resourceId]
              properties:
                titulo:
                  type: string
                conteudo:
                  type: string
                resourceId:
                  type: string
      responses:
        '302':
          description: Redireciona para o detalhe do post

  /posts/{id}/comments:
    post:
      tags: [Posts]
      summary: Criar comentário num post
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [texto]
              properties:
                texto:
                  type: string
      responses:
        '302':
          description: Redireciona para o detalhe do post

  /posts/{id}/comments/{cid}/delete:
    post:
      tags: [Posts]
      summary: Remover comentário de post
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: cid
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redireciona para o detalhe do post

  /posts/{id}/delete:
    post:
      tags: [Posts]
      summary: Remover post
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redireciona para lista de posts

  /admin/users:
    get:
      tags: [Admin]
      summary: Listar utilizadores
      security:
        - sessionCookie: []
      responses:
        '200':
          description: HTML com gestão de utilizadores
          content:
            text/html:
              schema:
                type: string

  /admin/users/{id}/role:
    post:
      tags: [Admin]
      summary: Atualizar role de utilizador
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, produtor, consumidor]
      responses:
        '302':
          description: Redireciona para gestão de utilizadores

  /admin/users/{id}/delete:
    post:
      tags: [Admin]
      summary: Remover utilizador
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redireciona para gestão de utilizadores

  /admin/news:
    get:
      tags: [Admin]
      summary: Listar notícias
      security:
        - sessionCookie: []
      responses:
        '200':
          description: HTML com gestão de notícias
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [Admin]
      summary: Criar notícia
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [titulo, conteudo]
              properties:
                titulo:
                  type: string
                conteudo:
                  type: string
      responses:
        '302':
          description: Redireciona para gestão de notícias

  /admin/news/{id}/delete:
    post:
      tags: [Admin]
      summary: Remover notícia
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redireciona para gestão de notícias

  /admin/export:
    get:
      tags: [Admin]
      summary: Exportar dump de dados com filtros opcionais
      security:
        - sessionCookie: []
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [all, resources, news, users]
            default: all
        - name: resourceType
          in: query
          schema:
            type: string
        - name: resourceYear
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 3000
        - name: resourceTheme
          in: query
          schema:
            type: string
        - name: resourceHashtag
          in: query
          schema:
            type: string
        - name: resourceVisibility
          in: query
          schema:
            type: string
            enum: [publico, privado]
        - name: resourceProducer
          in: query
          schema:
            type: string
        - name: resourceCreatedFrom
          in: query
          schema:
            type: string
            format: date
        - name: resourceCreatedTo
          in: query
          schema:
            type: string
            format: date
        - name: newsType
          in: query
          schema:
            type: string
            enum: [manual, system]
        - name: newsEventType
          in: query
          schema:
            type: string
        - name: newsCreatedBy
          in: query
          schema:
            type: string
        - name: newsPublishedFrom
          in: query
          schema:
            type: string
            format: date
        - name: newsPublishedTo
          in: query
          schema:
            type: string
            format: date
        - name: recentLimit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Ficheiro JSON para download
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '302':
          description: Redireciona para dashboard de dados em erro

  /admin/import:
    get:
      tags: [Admin]
      summary: Formulário de importação de dump com filtros
      security:
        - sessionCookie: []
      responses:
        '200':
          description: HTML do formulário de importação
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [Admin]
      summary: Importar dump com filtros
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                dumpFile:
                  type: string
                  format: binary
                  description: Ficheiro JSON descarregado pela exportação, com recursos completos e ficheiros AIP.
                dumpText:
                  type: string
                  description: Alternativa legada para colar manualmente o JSON do dump.
                scope:
                  type: string
                  enum: [all, resources, news, users]
                resourceType:
                  type: string
                resourceYear:
                  type: integer
                  minimum: 0
                  maximum: 3000
                resourceTheme:
                  type: string
                resourceHashtag:
                  type: string
                resourceVisibility:
                  type: string
                  enum: [publico, privado]
                resourceProducer:
                  type: string
                resourceCreatedFrom:
                  type: string
                  format: date
                resourceCreatedTo:
                  type: string
                  format: date
                newsType:
                  type: string
                  enum: [manual, system]
                newsEventType:
                  type: string
                newsCreatedBy:
                  type: string
                newsPublishedFrom:
                  type: string
                  format: date
                newsPublishedTo:
                  type: string
                  format: date
                recentLimit:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: HTML com relatório de importação
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redireciona para o formulário em caso de erro

  /admin/data:
    get:
      tags: [Admin]
      summary: Dashboard de operações de dados
      security:
        - sessionCookie: []
      responses:
        '200':
          description: HTML do dashboard de dados
          content:
            text/html:
              schema:
                type: string

  /admin/audit:
    get:
      tags: [Admin]
      summary: Página administrativa de auditoria
      security:
        - sessionCookie: []
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [success, failure]
        - name: service
          in: query
          schema:
            type: string
        - name: actorId
          in: query
          schema:
            type: string
        - name: targetType
          in: query
          schema:
            type: string
        - name: targetId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: HTML da listagem de auditoria
          content:
            text/html:
              schema:
                type: string
