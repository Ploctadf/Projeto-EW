openapi: 3.0.3
info:
  title: EW2026 API Service
  version: 1.0.0
  description: API principal da plataforma de recursos educativos.
servers:
  - url: http://localhost:16020
    description: API via gateway
  - url: http://localhost:16025
    description: API direta
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
  schemas:
    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        code:
          type: string
          example: INVALID_ID
        message:
          type: string
          example: id invalido
        categoria:
          type: string
          nullable: true
          example: metadados
        details:
          nullable: true
        erros:
          type: array
          nullable: true
          items:
            type: string
        validacoes:
          type: object
          nullable: true
        relatorio:
          type: object
          nullable: true
        requestId:
          type: string
          nullable: true
        error:
          type: string
          example: id invalido
    PaginationResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 5
    Resource:
      type: object
      properties:
        _id:
          type: string
          example: 663d8af2d6b8fd24f7a22b10
        produtor:
          type: string
          example: produtor.teste
        aipPath:
          type: string
          example: /aip/663d8af2d6b8fd24f7a22b10
        aipFile:
          type: object
          properties:
            originalName:
              type: string
              example: ficha-algebra.zip
            storageName:
              type: string
              example: sip.zip
            path:
              type: string
              example: /aip/663d8af2d6b8fd24f7a22b10/sip.zip
            mimeType:
              type: string
              example: application/zip
            size:
              type: integer
              example: 183245
        metadata:
          type: object
          additionalProperties: true
          example:
            resource:
              titulo: Relatorio de Matematica 8o ano
              tipo: relatorio
              ano: 8
              tema: algebra
              hashtags: [matematica, exercicios]
              visibilidade: publico
    Post:
      type: object
      properties:
        _id:
          type: string
          example: 663d8af2d6b8fd24f7a22b11
        titulo:
          type: string
          example: Novo recurso de algebra
        conteudo:
          type: string
          example: Publiquei um novo recurso para treino.
        resourceId:
          type: string
          nullable: true
          example: 663d8af2d6b8fd24f7a22b10
        autorId:
          type: string
          example: produtor.teste
        autorNome:
          type: string
          example: Produtor Teste
    Comment:
      type: object
      properties:
        _id:
          type: string
          example: 663d8af2d6b8fd24f7a22b12
        postId:
          type: string
          example: 663d8af2d6b8fd24f7a22b11
        autorId:
          type: string
          example: consumidor.teste
        autorNome:
          type: string
          example: Consumidor Teste
        texto:
          type: string
          example: Excelente recurso!
    Rating:
      type: object
      properties:
        _id:
          type: string
          example: 663d8af2d6b8fd24f7a22b13
        resourceId:
          type: string
          example: 663d8af2d6b8fd24f7a22b10
        userId:
          type: string
          example: consumidor.teste
        stars:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
    NewsItem:
      type: object
      properties:
        _id:
          type: string
          example: 663d8af2d6b8fd24f7a22b14
        titulo:
          type: string
          example: Bem-vindos a plataforma
        conteudo:
          type: string
          example: Sistema atualizado com novas funcionalidades.
        createdBy:
          type: string
          example: admin.teste
        publicadoEm:
          type: string
          format: date-time
paths:
  /api/openapi.json:
    get:
      tags: [Docs]
      summary: Obter especificacao OpenAPI em JSON
      responses:
        '200':
          description: Especificacao OpenAPI da API

  /api/docs:
    get:
      tags: [Docs]
      summary: Interface Swagger UI da API
      responses:
        '200':
          description: HTML do Swagger UI da API
          content:
            text/html:
              schema:
                type: string

  /api/health:
    get:
      tags: [Health]
      summary: Health check da API
      responses:
        '200':
          description: Servico disponivel

  /api/oais/ingest:
    post:
      tags: [OAIS]
      summary: Ingerir SIP (ZIP) e criar recurso
      description: Requer autenticacao com role produtor ou admin. Aceita apenas SIP em ZIP com manifest.json na raiz, data/ e checksums.txt opcional.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [sip]
              properties:
                sip:
                  type: string
                  format: binary
                  description: Ficheiro SIP em ZIP.
      responses:
        '400':
          description: Ficheiro em falta, demasiado grande ou com tipo invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: SIP ingerido com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  resourceId:
                    type: string
                    example: 663d8af2d6b8fd24f7a22b10
                  aipId:
                    type: string
                    example: SIP-2026-00001
                  validacoes:
                    type: object
                  relatorio:
                    type: object
        '401':
          description: Nao autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: SIP invalido; resposta inclui categoria, erros, validacoes por camada e relatorio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/oais/ingest/simples:
    post:
      tags: [OAIS]
      summary: Criar recurso por submissao simples
      description: Recebe metadados e ficheiros soltos, gera automaticamente um SIP com manifest.json, bagit.txt, checksums.txt e data/, e executa o mesmo processo de ingestao.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [titulo, tipo, visibilidade, ficheiros]
              properties:
                titulo:
                  type: string
                subtitulo:
                  type: string
                tipo:
                  type: string
                ano:
                  type: integer
                tema:
                  type: string
                hashtags:
                  type: string
                  description: Lista separada por virgulas.
                dataCriacao:
                  type: string
                descricao:
                  type: string
                visibilidade:
                  type: string
                  enum: [publico, privado]
                ficheiros:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Recurso criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  resourceId:
                    type: string
        '400':
          description: Pedido invalido ou demasiado grande
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Nao autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Metadados ou SIP gerado invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/oais/access/{id}:
    get:
      tags: [OAIS]
      summary: Descarregar DIP em ZIP
      description: Converte o AIP preservado em storage num DIP ZIP no momento do download.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ZIP do recurso
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          description: Recurso privado sem autenticacao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sem permissao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recurso ou ficheiro nao encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/resources:
    get:
      tags: [Resources]
      summary: Listar recursos
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: limit
          in: query
          schema:
            type: integer
            example: 10
        - name: tipo
          in: query
          schema:
            type: string
            example: relatorio
        - name: ano
          in: query
          schema:
            type: integer
            example: 8
        - name: tema
          in: query
          schema:
            type: string
            example: algebra
        - name: hashtag
          in: query
          schema:
            type: string
            example: matematica
      responses:
        '200':
          description: Lista paginada de recursos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Resource'

  /api/resources/{id}:
    get:
      tags: [Resources]
      summary: Obter recurso por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recurso encontrado
        '404':
          description: Recurso nao encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags: [Resources]
      summary: Atualizar metadata de recurso (owner/admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  type: object
                  additionalProperties: true
            example:
              metadata:
                resource:
                  titulo: Ficha atualizada
                  visibilidade: privado
      responses:
        '200':
          description: Recurso atualizado
        '403':
          description: Sem permissao

    delete:
      tags: [Resources]
      summary: Apagar recurso (owner/admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recurso removido

  /api/posts:
    get:
      tags: [Posts]
      summary: Listar posts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: limit
          in: query
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: Lista paginada de posts

    post:
      tags: [Posts]
      summary: Criar post sobre um recurso
      description: Requer utilizador autenticado. O recurso associado tem de ser visível para o utilizador.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, conteudo, resourceId]
              properties:
                titulo:
                  type: string
                conteudo:
                  type: string
                resourceId:
                  type: string
            example:
              titulo: Novo recurso de algebra
              conteudo: Publiquei um novo recurso para treino.
              resourceId: 663d8af2d6b8fd24f7a22b10
      responses:
        '201':
          description: Post criado

  /api/posts/{id}:
    get:
      tags: [Posts]
      summary: Obter post por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post encontrado

    patch:
      tags: [Posts]
      summary: Atualizar post (owner/admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titulo:
                  type: string
                conteudo:
                  type: string
      responses:
        '200':
          description: Post atualizado

    delete:
      tags: [Posts]
      summary: Apagar post (owner/admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post apagado

  /api/posts/{id}/comments:
    get:
      tags: [Comments]
      summary: Listar comentarios de um post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: limit
          in: query
          schema:
            type: integer
            example: 20
      responses:
        '200':
          description: Lista paginada de comentarios

    post:
      tags: [Comments]
      summary: Criar comentario
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto:
                  type: string
            example:
              texto: Excelente recurso!
      responses:
        '201':
          description: Comentario criado

  /api/posts/{id}/comments/{cid}:
    delete:
      tags: [Comments]
      summary: Apagar comentario (autor/admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: cid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comentario apagado

  /api/resources/{id}/ratings:
    post:
      tags: [Ratings]
      summary: Criar/atualizar rating do utilizador autenticado
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars:
                  type: integer
                  minimum: 1
                  maximum: 5
            example:
              stars: 5
      responses:
        '201':
          description: Rating gravado

    get:
      tags: [Ratings]
      summary: Obter media de ratings do recurso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Estatisticas de ratings
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  media:
                    type: number
                    format: float
                    example: 4.67
                  total:
                    type: integer
                    example: 12

  /api/resources/{id}/ratings/mine:
    get:
      tags: [Ratings]
      summary: Obter rating do utilizador autenticado para o recurso
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rating do utilizador no recurso
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  rating:
                    allOf:
                      - $ref: '#/components/schemas/Rating'
                    nullable: true
        '401':
          description: Nao autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/news:
    get:
      tags: [News]
      summary: Listar noticias
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: limit
          in: query
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: Lista paginada de noticias

    post:
      tags: [News]
      summary: Criar noticia (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, conteudo]
              properties:
                titulo:
                  type: string
                conteudo:
                  type: string
            example:
              titulo: Nova funcionalidade
              conteudo: Foi adicionada documentacao Swagger.
      responses:
        '201':
          description: Noticia criada

  /api/news/system:
    post:
      tags: [News]
      summary: Criar noticia de sistema (uso interno entre servicos)
      description: Endpoint interno. Requer `X-Internal-Token` (ou Authorization Bearer com token interno).
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, conteudo, eventType]
              properties:
                titulo:
                  type: string
                conteudo:
                  type: string
                eventType:
                  type: string
                dedupeKey:
                  type: string
                payload:
                  type: object
                  additionalProperties: true
            example:
              titulo: Atualizacao de utilizadores da plataforma
              conteudo: O sistema tem agora 3 utilizadores ativos (3 no total).
              eventType: system.total_users
              dedupeKey: system.total_users:2026-04-26T11:28:56.000Z
              payload:
                totalUsers: 3
                totalActiveUsers: 3
      responses:
        '201':
          description: Noticia de sistema criada
        '401':
          description: Token interno ausente ou invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/news/{id}:
    delete:
      tags: [News]
      summary: Apagar noticia (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Noticia removida

  /api/export:
    get:
      tags: [Export]
      summary: Exportar dados da plataforma com filtros opcionais (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: scope
          in: query
          description: Escopo a exportar.
          schema:
            type: string
            enum: [all, resources, news, users]
            default: all
        - name: resourceType
          in: query
          description: Filtra recursos por metadata.resource.tipo quando o escopo inclui recursos.
          schema:
            type: string
        - name: resourceYear
          in: query
          description: Filtra recursos por metadata.resource.ano.
          schema:
            type: integer
            minimum: 0
            maximum: 3000
        - name: resourceTheme
          in: query
          description: Filtra recursos por metadata.resource.tema.
          schema:
            type: string
        - name: resourceHashtag
          in: query
          description: Filtra recursos por hashtag.
          schema:
            type: string
        - name: resourceVisibility
          in: query
          description: Filtra recursos por visibilidade.
          schema:
            type: string
            enum: [publico, privado]
        - name: resourceProducer
          in: query
          description: Filtra recursos pelo id do produtor.
          schema:
            type: string
        - name: resourceCreatedFrom
          in: query
          description: Filtra recursos criados a partir desta data.
          schema:
            type: string
            format: date
        - name: resourceCreatedTo
          in: query
          description: Filtra recursos criados até esta data.
          schema:
            type: string
            format: date
        - name: newsType
          in: query
          description: Filtra noticias por tipo.
          schema:
            type: string
            enum: [manual, system]
        - name: newsEventType
          in: query
          description: Filtra noticias por eventType.
          schema:
            type: string
        - name: newsCreatedBy
          in: query
          description: Filtra noticias por createdBy.
          schema:
            type: string
        - name: newsPublishedFrom
          in: query
          description: Filtra noticias publicadas a partir desta data.
          schema:
            type: string
            format: date
        - name: newsPublishedTo
          in: query
          description: Filtra noticias publicadas até esta data.
          schema:
            type: string
            format: date
        - name: recentLimit
          in: query
          description: Limita recursos e noticias aos N registos mais recentes.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Dump JSON de dados da plataforma
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/import:
    post:
      tags: [Export]
      summary: Importar dump da plataforma com filtros opcionais (admin)
      description: Aceita JSON no corpo ou multipart/form-data com dumpFile. Quando usado dumpFile, apenas ficheiros .json sao aceites (ate 256 MB por omissao).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                dump:
                  type: object
                  additionalProperties: true
                  description: Dump exportado previamente.
                filters:
                  type: object
                  properties:
                    scope:
                      type: string
                      enum: [all, resources, news, users]
                    resourceType:
                      type: string
                    resourceYear:
                      type: integer
                      minimum: 0
                      maximum: 3000
                    resourceTheme:
                      type: string
                    resourceHashtag:
                      type: string
                    resourceVisibility:
                      type: string
                      enum: [publico, privado]
                    resourceProducer:
                      type: string
                    resourceCreatedFrom:
                      type: string
                      format: date
                    resourceCreatedTo:
                      type: string
                      format: date
                    newsType:
                      type: string
                      enum: [manual, system]
                    newsEventType:
                      type: string
                    newsCreatedBy:
                      type: string
                    newsPublishedFrom:
                      type: string
                      format: date
                    newsPublishedTo:
                      type: string
                      format: date
                    recentLimit:
                      type: integer
                      minimum: 1
          multipart/form-data:
            schema:
              type: object
              properties:
                dumpFile:
                  type: string
                  format: binary
                  description: Ficheiro JSON de dump exportado previamente, incluindo recursos completos e ficheiros AIP.
                dump:
                  type: string
                  description: Alternativa legada para colar JSON em texto.
                scope:
                  type: string
                  enum: [all, resources, news, users]
                resourceType:
                  type: string
                resourceYear:
                  type: integer
                  minimum: 0
                  maximum: 3000
                resourceTheme:
                  type: string
                resourceHashtag:
                  type: string
                resourceVisibility:
                  type: string
                  enum: [publico, privado]
                resourceProducer:
                  type: string
                resourceCreatedFrom:
                  type: string
                  format: date
                resourceCreatedTo:
                  type: string
                  format: date
                newsType:
                  type: string
                  enum: [manual, system]
                newsEventType:
                  type: string
                newsCreatedBy:
                  type: string
                newsPublishedFrom:
                  type: string
                  format: date
                newsPublishedTo:
                  type: string
                  format: date
                recentLimit:
                  type: integer
                  minimum: 1
      responses:
        '400':
          description: Dump invalido, demasiado grande ou com tipo de ficheiro invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Importacao concluida
        '207':
          description: Importacao parcialmente concluida

